name: Tests et build FBAC Gestion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-et-build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Exécuter tous les tests automatisés
        run: npm test

      - name: Construire l'installateur Windows
        run: npm run build:win
