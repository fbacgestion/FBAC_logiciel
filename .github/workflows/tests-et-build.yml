name: Tests et build FBAC Gestion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-et-build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier la syntaxe de tous les fichiers JavaScript
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path backend, frontend, tests -Recurse -Filter *.js -File | ForEach-Object {
            Write-Host "Vérification : $($_.FullName)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Exécuter tous les tests automatisés
        run: npm test

      - name: Construire l'installateur Windows sans publication
        run: npx electron-builder --win nsis --publish never

      - name: Conserver l'installateur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: FBAC-Gestion-installateur-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
